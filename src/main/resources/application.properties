# ===================================================================
# Tourism Analytics Dashboard Configuration
# ===================================================================
spring.application.name=tourism-analytics
server.port=8080

# ===================================================================
# Pre-Generated Authentication Token Configuration
# (Existing valid token for authorization - never expose in responses or logs)
# ===================================================================
auth.token=tourism-analytics-secret-token-2026
tourism.auth.token=tourism-analytics-secret-token-2026

# ===================================================================
# In-Memory H2 Database Configuration
# ===================================================================
spring.datasource.url=jdbc:h2:mem:tourismdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Enable H2 Web Console for inspection at http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false
